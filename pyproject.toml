[project]
name = "soccer-decision-engine"
version = "0.1.0"
description = "Hybrid football prediction and decision intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "xgboost>=3.0,<4",
  "catboost>=1.2,<2",
  "joblib>=1.5,<2",
  "pytest>=8.4,<9",
]
